<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Suchánek</title>
    <meta name="description" content="Pošta, úkoly a kontakty na jednom místě." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#13769a" />

    <!-- Téma před prvním paintem (synchronní, blokující skript — záměrně, aby
         nebyl záblesk). Kód je v `public/theme-init.js`, ne inline, kvůli CSP
         `script-src 'self'` ve `vercel.json`. Klíč musí sedět
         s `THEME_STORAGE_KEY` v `src/lib/theme.ts`. -->
    <script src="/theme-init.js"></script>

    <!-- Inter musí začít tahat dřív než bundle, jinak se po načtení `index.css`
         přeformátuje už vykreslený text. Dancing Script je písmo „podpisu"
         pro značku Suchánek (`font-signature` v tailwind.config.ts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
